# ChemSentry -- Mosquitto broker config (local dev)
# Per-device TLS certificates are required; unregistered/unauthenticated
# connections are rejected. See ChemSentry_Final_Plan.md Part VI Section 17.
#
# Certs are not included in the repo (see firmware/certs/README.md) --
# generate a local CA + server + device certs before `docker compose up`.

listener 8883
cafile /mosquitto/certs/ca.crt.pem
certfile /mosquitto/certs/server.crt.pem
keyfile /mosquitto/certs/server.key.pem
require_certificate true
# require_certificate only performs mutual-TLS identity verification at the
# transport layer -- it does NOT by itself authorize the MQTT CONNECT that
# follows. Without allow_anonymous, Mosquitto 2.x still demands a separate
# username/password on top of a valid client cert and rejects every
# connection with "Not authorized" (CONNACK 5), even from a device holding a
# cert signed by cafile above. Since a valid per-device cert is exactly the
# credential this broker is meant to require (see the header comment), that
# TLS handshake already IS the authentication step; allow_anonymous here
# does not mean "no authentication," it means "no second, redundant
# username/password layer stacked on top of the mutual TLS already enforced."
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
