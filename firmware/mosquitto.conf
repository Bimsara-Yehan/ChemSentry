# ChemSentry -- Mosquitto broker config (local dev)
# Per-device TLS certificates are required; unregistered/unauthenticated
# connections are rejected. See ChemSentry_Final_Plan.md Part VI Section 17.
#
# Certs are not included in the repo (see firmware/certs/README.md) --
# generate a local CA + server + device certs before `docker compose up`.

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
